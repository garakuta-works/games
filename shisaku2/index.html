<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>ゾンビ合成</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game" aria-label="ゾンビ合成のゲーム画面"></canvas>
<button id="muteBtn" class="icon-btn" aria-label="音のオン/オフ" title="音のオン/オフ">
  <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path id="muteWave" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9c1.3 1.6 1.3 4.4 0 6M18.5 6.5c2.8 3 2.8 8 0 11"/><path id="muteX" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" d="M16 9l5 6M21 9l-5 6"/></svg>
</button>
<div id="startScreen" class="overlay hidden">
  <div class="panel">
    <div class="logo"><span>ゾンビ</span><span>合成</span></div>
    <ul class="howto">
      <li><i class="dot a"></i><span>左右にドラッグ → 指をはなすと落ちる</span></li>
      <li><i class="dot b"></i><span>同じゾンビがくっつくと進化</span></li>
      <li><i class="dot c"></i><span>赤い線より上にあふれたら終わり</span></li>
    </ul>
    <canvas id="ladder" width="600" height="80" aria-hidden="true"></canvas>
    <button id="startBtn" class="big-btn">スタート</button>
    <div class="best">ベスト <b id="startBest">0</b></div>
  </div>
</div>
<div id="overScreen" class="overlay hidden">
  <div class="panel">
    <div class="over-title">あふれた！</div>
    <div class="over-label">スコア</div>
    <div id="overScore" class="over-score">0</div>
    <div id="newBest" class="new-best hidden">NEW BEST!</div>
    <div class="stats">
      <div><span>ベスト</span><b id="overBest">0</b></div>
      <div><span>いちばん大きく育てたゾンビ</span><b id="overMax">-</b></div>
    </div>
    <button id="retryBtn" class="big-btn">もう一度</button>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
