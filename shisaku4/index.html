<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>試作4</title>
<style>
:root{--bg:#070b1c;--ink:#1d2340;--card:#f4f1ea;--rim:#c9b98a;--accent:#e88a2a;--accentDark:#9a4e10;--sub:#5a6080;--subbtn:#4a5a8a;--subbtnDark:#2a345a;--howbg:#e6e3ee;--logo1:#ffe6a0;--logo2:#ff9a3a;--logoShadow:#3a1a08}
html,body{margin:0;height:100%;background:var(--bg);font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","M PLUS Rounded 1c","Noto Sans CJK JP",system-ui,sans-serif;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;color:var(--ink)}
#wrap{display:flex;justify-content:center;align-items:center;height:100%}
canvas{display:block;height:min(100vh,calc(100vw*640/420));width:auto;aspect-ratio:420/640;touch-action:none;box-shadow:0 0 40px rgba(0,0,0,.45)}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 40%,rgba(0,0,0,.25),rgba(0,0,0,.6));backdrop-filter:blur(2px)}
.card{position:relative;background:var(--card);border-radius:24px;padding:20px 22px 16px;text-align:center;width:300px;line-height:1.5;box-shadow:0 18px 50px rgba(0,0,0,.45),inset 0 0 0 3px var(--rim)}
.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) both}
@keyframes pop{from{transform:scale(.6) translateY(30px);opacity:0}to{transform:none;opacity:1}}
.logo{font-size:46px;font-weight:900;letter-spacing:2px;line-height:1.05;margin:2px 0 4px;background:linear-gradient(180deg,var(--logo1),var(--logo2));-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 var(--logoShadow)) drop-shadow(0 6px 10px rgba(0,0,0,.25));animation:float 3s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-4px) rotate(-1deg)}}
.tag{font-size:13px;font-weight:bold;color:var(--sub);letter-spacing:3px;margin-bottom:10px}
.how{list-style:none;padding:10px 12px;margin:0 0 12px;background:var(--howbg);border-radius:14px;text-align:left;font-size:13px}
.how li{margin:3px 0;padding-left:22px;position:relative}
.how li:before{content:attr(data-i);position:absolute;left:0;top:1px;width:17px;height:17px;border-radius:50%;background:var(--accent);color:#fff;font-size:11px;text-align:center;line-height:17px;font-weight:bold}
button{font:inherit;font-weight:900;border:0;border-radius:14px;padding:10px 14px;margin:4px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 4px 0 var(--accentDark);transition:transform .06s,box-shadow .06s}
button:active{transform:translateY(3px);box-shadow:0 1px 0 var(--accentDark)}
button.big{font-size:19px;padding:13px 10px;width:100%;margin:2px 0 6px;letter-spacing:2px}
button.sub{background:var(--subbtn);box-shadow:0 4px 0 var(--subbtnDark);font-size:13px}
.row{display:flex;gap:6px;justify-content:center}.row button{flex:1}
.small{font-size:11.5px;color:var(--sub);min-height:14px;white-space:pre-wrap;word-break:break-all}
.rank{font-size:30px;font-weight:900;color:var(--accent);text-shadow:0 3px 0 var(--accentDark);animation:stamp .5s .15s cubic-bezier(.2,1.8,.4,1) both}
@keyframes stamp{from{transform:scale(2.4) rotate(-12deg);opacity:0}to{transform:none;opacity:1}}
.score{font-size:15px;font-weight:bold;margin:2px 0}
.emoji{font-size:28px;letter-spacing:4px;margin:4px 0 8px}

/* スマホ対応（2026-10-25）：小ボタンを44px以上に、横持ちのスマホでは縦持ちの案内を出す */
button.sub,.row button{min-height:44px}
#rotate{position:fixed;inset:0;z-index:50;display:none;flex-direction:column;align-items:center;justify-content:center;gap:8px;background:rgba(10,12,26,.94);color:#fff;text-align:center;font-weight:900;font-size:18px;padding:20px}
#rotate .rs{font-size:13px;font-weight:bold;opacity:.8}
#rotate .ri{font-size:44px}
@media (orientation:landscape) and (max-height:500px) and (pointer:coarse){#rotate{display:flex}}
.tells{display:flex;gap:6px;justify-content:center;margin:6px 0 10px}
.tells div{flex:1;background:#1d2340;color:#e8e6f4;border-radius:12px;padding:4px 2px 6px;font-size:11px;line-height:1.35}
.tells canvas{width:100%;height:auto;display:block}
/* ことば切替（2026-10-26）：歯車は44px角。英語用の詰めは .lang-en の時だけ（日本語の見た目は変えない） */
.card{position:relative}
.gear{position:absolute;z-index:3;top:4px;right:4px;width:44px;height:44px;min-height:44px;padding:0;margin:0;background:transparent;box-shadow:none;color:var(--sub);font-size:22px;line-height:44px}
.gear:active{transform:none;background:rgba(0,0,0,.06)}
button[aria-pressed="true"]{outline:3px solid var(--accent);outline-offset:2px}
.lang-en .tag{letter-spacing:1px}
.lang-en .row button{font-size:13px}
.lang-en .small{word-break:normal;overflow-wrap:anywhere} /* 英語は単語の途中で折らない */
/* v3i（2026-10-26）：スマホの上下の余白を車内の色でつなぐ／結果に「じぶんの最高」と「つぎのコツ」（見た目だけ。判定・時間には触れない） */
html,body{background:linear-gradient(180deg,#0b0f22 0%,#0b0f22 18%,#1c1622 62%,#120e1a 100%)}
#wrap{background:radial-gradient(ellipse at 50% 58%,rgba(255,196,120,.08),rgba(0,0,0,0) 62%)}
.best{font-size:12px;font-weight:bold;color:var(--sub);margin:0 0 6px}
.best.new{color:var(--accent);animation:stamp .5s .5s cubic-bezier(.2,1.8,.4,1) both}
.tip{font-size:12px;line-height:1.55;color:#4a3a20;background:#f3e4c0;border-radius:12px;padding:7px 10px;margin:0 0 8px;text-align:left}
.tip:empty,.best:empty{display:none}
</style>
</head>
<body>
<div id="wrap"><canvas id="c"></canvas></div>
<div id="rotate" aria-live="polite"><div class="ri">📱</div><div id="rotateMsg" data-i18n="rotate_msg">スマホを縦にして遊んでね</div><div class="rs" id="rotateSub" data-i18n="rotate_sub">このゲームは縦長の画面用です</div></div>

<div id="start" class="ov"><div class="card pop">
  <button id="bGear" class="gear" aria-label="設定" data-i18n-aria="settings">⚙</button>
  <div class="tag" data-i18n="tag"></div>
  <ul class="how">
    <li data-i="1" data-i18n="how1"></li>
    <li data-i="2" data-i18n="how2"></li>
    <li data-i="3" data-i18n="how3"></li>
  </ul>
  <button id="bDaily" data-i18n="b_daily" class="big">今夜の便にのる</button>
  <div class="row"><button id="bPrac" data-i18n="b_prac" class="sub">れんしゅう</button><button id="bHow" data-i18n="b_how" class="sub">灯りの見かた</button></div>
  <div id="dailyInfo" class="small"></div>
</div></div>

<div id="howto" class="ov"><div class="card pop">
  <div class="tag" style="font-size:16px;font-weight:900" data-i18n="how_head"></div>
  <div class="tells">
    <div><canvas id="h1" width="120" height="130"></canvas><span data-i18n="tell1">その次で降りる<br>色がちらちら</span></div>
    <div><canvas id="h2" width="120" height="130"></canvas><span data-i18n="tell2">つぎで降りる<br>色が灯り、フード</span></div>
    <div><canvas id="h3" width="120" height="130"></canvas><span data-i18n="tell3">もうすぐ<br>灯りを高くかかげる</span></div>
  </div>
  <canvas id="legend" width="600" height="78" style="width:100%;height:auto;aspect-ratio:600/78;box-shadow:none;display:block;background:#1d2340;border-radius:12px;margin-bottom:8px"></canvas>
  <div class="small" style="text-align:left;line-height:1.6" data-i18n="how_note"></div>
  <button id="bHowBack" data-i18n="b_howback" class="big">わかった</button>
</div></div>

<div id="over" class="ov"><div class="card pop">
  <div id="rRank" class="rank"></div>
  <div id="rScore" class="score"></div>
  <div id="emoji" class="emoji"></div>
  <div id="rSub" class="small"></div>
  <div id="rBest" class="best"></div>
  <div id="rTip" class="tip"></div>
  <button id="bRetry" data-i18n="b_retry" class="big">もう一回（れんしゅう）</button>
  <div class="row"><button id="bCopy" data-i18n="b_copy" class="sub">結果をコピー</button><button id="bMenu" data-i18n="b_menu" class="sub">タイトルへ</button></div>
  <div id="msg" class="small"></div>
</div></div>

<div id="settings" class="ov"><div class="card pop">
  <div class="rank" data-i18n="settings_title">設定</div>
  <div class="small" data-i18n="lang_label">ことば / Language</div>
  <div class="row"><button class="sub" data-lang="ja" lang="ja">日本語</button><button class="sub" data-lang="en" lang="en">English</button></div>
  <button id="bSetClose" class="big" data-i18n="close">とじる</button>
</div></div>

<script>
// ===== 共通キット：音（WebAudio合成のみ）・演出（パーティクル/揺れ/ヒットストップ）・乱数 =====
const PARAMS=new URLSearchParams(location.search);
const AUTOTEST=!!PARAMS.get('autotest');
const FONT='"Hiragino Maru Gothic ProN","Rounded Mplus 1c","M PLUS Rounded 1c","Noto Sans CJK JP",system-ui,sans-serif';
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function todaySeed(d=new Date()){return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate();}
const easeOut=k=>1-Math.pow(1-Math.min(1,Math.max(0,k)),3);
const easeOutBack=k=>{k=Math.min(1,Math.max(0,k));const c=1.9;return 1+(c+1)*Math.pow(k-1,3)+c*Math.pow(k-1,2);};
const lerp=(a,b,k)=>a+(b-a)*k;
const NOTE=n=>440*Math.pow(2,(n-69)/12);
function rrect(ctx,x,y,w,h,r){ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);}
function starPath(ctx,x,y,r,rot){ctx.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5,q=i%2?r*0.45:r;ctx.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}ctx.closePath();}
function setupCanvas(cv,W,H){const dpr=AUTOTEST?1:Math.min(2,window.devicePixelRatio||1);cv.width=W*dpr;cv.height=H*dpr;return {ctx:cv.getContext('2d'),dpr};}

const SND=(()=>{
  let ac=null,master=null,wetBus=null,nbuf=null;
  function init(){
    if(AUTOTEST)return null;
    if(ac){if(ac.state==='suspended')ac.resume();return ac;}
    try{ac=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return null;}
    const comp=ac.createDynamicsCompressor();comp.threshold.value=-16;comp.ratio.value=5;comp.attack.value=0.002;comp.release.value=0.25;
    master=ac.createGain();master.gain.value=0.85;master.connect(comp);comp.connect(ac.destination);
    const rev=ac.createConvolver();const r=ac.sampleRate,len=Math.floor(r*2.2),b=ac.createBuffer(2,len,r);
    for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3.2);}
    rev.buffer=b;wetBus=ac.createGain();wetBus.gain.value=0.32;wetBus.connect(rev);rev.connect(master);
    const nl=ac.sampleRate*2;nbuf=ac.createBuffer(1,nl,ac.sampleRate);const nd=nbuf.getChannelData(0);for(let i=0;i<nl;i++)nd[i]=Math.random()*2-1;
    return ac;
  }
  function route(node,wet,pan){let n=node;if(pan&&ac.createStereoPanner){const p=ac.createStereoPanner();p.pan.value=pan;node.connect(p);n=p;}n.connect(master);if(wet>0){const s=ac.createGain();s.gain.value=wet;n.connect(s);s.connect(wetBus);}}
  function tone({f=440,type='sine',dur=.2,vol=.2,at=0,att=.004,wet=.15,slide=0,detune=0,pan=0}){
    if(!init())return;const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,f*slide),t+dur);o.detune.value=detune;
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g);route(g,wet,pan);o.start(t);o.stop(t+dur+0.05);}
  function noise({dur=.2,vol=.2,at=0,type='lowpass',freq=1200,q=0.7,wet=.1,sweep=0,att=0.002,pan=0}){
    if(!init())return;const t=ac.currentTime+at,s=ac.createBufferSource();s.buffer=nbuf;
    const fl=ac.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(freq,t);if(sweep)fl.frequency.exponentialRampToValueAtTime(Math.max(30,freq*sweep),t+dur);fl.Q.value=q;
    const g=ac.createGain();g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+att);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    s.connect(fl);fl.connect(g);route(g,wet,pan);s.start(t,Math.random()*1.5);s.stop(t+dur+0.05);}
  function kick({f0=160,f1=42,dur=.45,vol=.9,at=0,wet=.08}){
    if(!init())return;const t=ac.currentTime+at,o=ac.createOscillator(),g=ac.createGain();
    o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(f1,t+0.11);
    g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);route(g,wet);o.start(t);o.stop(t+dur+0.05);}
  function bell({f=880,vol=.14,at=0,dur=1.5,wet=.45,pan=0}){[1,2.76,5.40,8.93].forEach((m,i)=>tone({f:f*m,dur:dur/(1+i*0.8),vol:vol/(1+i*1.6),at,att:.002,wet,pan}));}
  function arp(notes,{step=.07,at=0,type='triangle',vol=.11,dur=.55,wet=.35}={}){notes.forEach((n,i)=>{const f=NOTE(n);tone({f,type,dur,vol,at:at+i*step,wet});tone({f:f*2,dur:dur*.6,vol:vol*.35,at:at+i*step,wet});});}
  function loop({freq=50,noiseFreq=260,vol=.04}){
    if(!init())return null;const s=ac.createBufferSource();s.buffer=nbuf;s.loop=true;const fl=ac.createBiquadFilter();fl.type='lowpass';fl.frequency.value=noiseFreq;
    const g=ac.createGain();g.gain.value=0;s.connect(fl);fl.connect(g);g.connect(master);s.start();
    const o=ac.createOscillator();o.type='triangle';o.frequency.value=freq;const og=ac.createGain();og.gain.value=0;o.connect(og);og.connect(master);o.start();
    const set=(v,f,nf)=>{const t=ac.currentTime;g.gain.setTargetAtTime(v,t,.25);og.gain.setTargetAtTime(v*.5,t,.25);if(f)o.frequency.setTargetAtTime(f,t,.4);if(nf)fl.frequency.setTargetAtTime(nf,t,.4);};
    set(vol);return {set,stop(){set(0);setTimeout(()=>{try{s.stop();o.stop();}catch(e){}},900);}};}
  return {init,tone,noise,kick,bell,arp,loop,get on(){return !!ac}};
})();

const FX={parts:[],texts:[],rings:[],shakeT:0,shakeA:0,flashA:0,flashCol:'#fff',stop:0,zoom:0,zx:210,zy:320,queue:[],
  reset(){this.parts=[];this.texts=[];this.rings=[];this.shakeT=0;this.flashA=0;this.stop=0;this.zoom=0;this.queue=[];},
  burst(x,y,n,o={}){if(AUTOTEST)return;for(let i=0;i<n;i++){const a=(o.dir??-Math.PI/2)+(Math.random()-.5)*(o.spread??Math.PI*2),sp=(o.speed??200)*(0.35+Math.random()*0.9);
    this.parts.push({x:x+(Math.random()-.5)*(o.w||0),y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:(o.life??0.8)*(0.6+Math.random()*0.7),age:0,size:(o.size??4)*(0.6+Math.random()*0.8),
      col:Array.isArray(o.col)?o.col[Math.floor(Math.random()*o.col.length)]:(o.col??'#fff'),g:o.g??400,drag:o.drag??1.5,shape:o.shape??'circle',rot:Math.random()*6,vr:(Math.random()-.5)*12,glow:o.glow||0});}},
  ring(x,y,o={}){if(AUTOTEST)return;this.rings.push({x,y,age:0,life:o.life??.5,r0:o.r0??10,r1:o.r1??120,col:o.col??'#fff',w:o.w??6,sy:o.sy??1});},
  text(x,y,str,o={}){if(AUTOTEST)return;this.texts.push({x,y,str,age:0,life:o.life??1.1,size:o.size??30,col:o.col??'#fff',stroke:o.stroke??'#2a1a3a',rise:o.rise??36,pop:o.pop??2.0,rot:o.rot??0});},
  shake(a,t=.3){this.shakeA=Math.max(this.shakeA,a);this.shakeT=Math.max(this.shakeT,t);},
  flash(a=.6,col='#fff'){this.flashA=a;this.flashCol=col;},
  punch(z,x,y){this.zoom=Math.max(this.zoom,z);if(x!==undefined){this.zx=x;this.zy=y;}},
  hitstop(s,after){this.stop=Math.max(this.stop,s);if(after)this.queue.push(after);},
  update(dt){
    if(this.stop>0){this.stop-=dt;if(this.stop<=0){const q=this.queue;this.queue=[];q.forEach(f=>f());}return false;}
    for(const p of this.parts){p.age+=dt;const k=Math.exp(-p.drag*dt);p.vx*=k;p.vy=p.vy*k+p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;}
    this.parts=this.parts.filter(p=>p.age<p.life);for(const t of this.texts)t.age+=dt;this.texts=this.texts.filter(t=>t.age<t.life);
    for(const r of this.rings)r.age+=dt;this.rings=this.rings.filter(r=>r.age<r.life);
    this.shakeT=Math.max(0,this.shakeT-dt);this.flashA=Math.max(0,this.flashA-dt*2.2);this.zoom*=Math.exp(-dt*7);return true;},
  applyCam(ctx,W,H){const s=this.shakeT>0?this.shakeA*Math.min(1,this.shakeT*3.5):0;const z=1+this.zoom;
    ctx.translate(this.zx+(Math.random()-.5)*2*s,this.zy+(Math.random()-.5)*2*s);ctx.scale(z,z);ctx.translate(-this.zx,-this.zy);},
  draw(ctx){
    for(const r of this.rings){const k=r.age/r.life;ctx.globalAlpha=1-k;ctx.strokeStyle=r.col;ctx.lineWidth=r.w*(1-k)+0.5;ctx.beginPath();ctx.ellipse(r.x,r.y,lerp(r.r0,r.r1,easeOut(k)),lerp(r.r0,r.r1,easeOut(k))*r.sy,0,0,7);ctx.stroke();}
    for(const p of this.parts){const k=1-p.age/p.life;ctx.globalAlpha=Math.max(0,Math.min(1,k*1.5));ctx.fillStyle=p.col;
      if(p.glow){ctx.shadowColor=p.col;ctx.shadowBlur=p.glow;}
      if(p.shape==='rect'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.size,-p.size*0.45,p.size*2,p.size*0.9);ctx.restore();}
      else if(p.shape==='star'){starPath(ctx,p.x,p.y,p.size*(0.5+0.5*k),p.rot);ctx.fill();}
      else if(p.shape==='leaf'){ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.beginPath();ctx.ellipse(0,0,p.size*1.4,p.size*0.6,0,0,7);ctx.fill();ctx.restore();}
      else{ctx.beginPath();ctx.arc(p.x,p.y,p.size*(0.35+0.65*k),0,7);ctx.fill();}
      ctx.shadowBlur=0;}
    ctx.globalAlpha=1;
    for(const t of this.texts){const k=t.age/t.life;const sc=k<0.14?lerp(t.pop,1,easeOutBack(k/0.14)):1;ctx.save();ctx.translate(t.x,t.y-t.rise*easeOut(k));ctx.rotate(t.rot);ctx.scale(sc,sc);
      ctx.globalAlpha=k>0.75?(1-k)/0.25:1;ctx.font=`900 ${t.size}px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.lineJoin='round';
      ctx.lineWidth=t.size/4.5;ctx.strokeStyle=t.stroke;ctx.strokeText(t.str,0,0);ctx.fillStyle=t.col;ctx.fillText(t.str,0,0);ctx.restore();}
    ctx.globalAlpha=1;},
  drawFlash(ctx,W,H){if(this.flashA>0){ctx.globalAlpha=Math.min(1,this.flashA);ctx.fillStyle=this.flashCol;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;}}
};
function copyText(t,msgEl){(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(()=>msgEl.textContent='コピーしました（どこにも投稿していません）').catch(()=>msgEl.textContent=t);}

// ================= 設定 =================
const W=420,H=640;
const N=6;
const STOPS=['ネムリの辻','シモヨ町','ケムリ峠','サンゴ浜','ユキミ坂','ヒバチ台','ワタユキ原','トオアカリ'];   // 8つ目「トオアカリ」が終点

const EN=()=>I18NKIT.lang==='en';

const SCOL=['#4f8cff','#ffb02e','#36d39a','#ff7aa8','#a77bff','#ff4b3e','#e8f0ff','#ffe0a0'];
// 色だけに頼らないよう、駅ごとに形の違う記号を付ける（色覚の個人差対策）
const SYM=['diamond','circle','triangle','heart','star','square','cross','sun'];
const SYMNAME=['ひし形','まる','さんかく','ハート','ほし','しかく','じゅうじ','たいよう'];
function symPath(c,k,x,y,r){c.beginPath();const t=SYM[k];
  if(t==='diamond'){c.moveTo(x,y-r*1.15);c.lineTo(x+r*.85,y);c.lineTo(x,y+r*1.15);c.lineTo(x-r*.85,y);c.closePath();}
  else if(t==='circle'){c.arc(x,y,r*.9,0,7);}
  else if(t==='triangle'){c.moveTo(x,y-r*1.05);c.lineTo(x+r*1.05,y+r*.8);c.lineTo(x-r*1.05,y+r*.8);c.closePath();}
  else if(t==='heart'){c.moveTo(x,y+r*.95);c.bezierCurveTo(x-r*1.5,y-r*.1,x-r*.75,y-r*1.25,x,y-r*.45);c.bezierCurveTo(x+r*.75,y-r*1.25,x+r*1.5,y-r*.1,x,y+r*.95);c.closePath();}
  else if(t==='star'){for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,q=i%2?r*.45:r*1.1;c.lineTo(x+Math.cos(a)*q,y+Math.sin(a)*q);}c.closePath();}
  else if(t==='square'){c.rect(x-r*.8,y-r*.8,r*1.6,r*1.6);}
  else if(t==='cross'){const a=r*.36,b=r*1.0;c.moveTo(x-a,y-b);c.lineTo(x+a,y-b);c.lineTo(x+a,y-a);c.lineTo(x+b,y-a);c.lineTo(x+b,y+a);c.lineTo(x+a,y+a);c.lineTo(x+a,y+b);c.lineTo(x-a,y+b);c.lineTo(x-a,y+a);c.lineTo(x-b,y+a);c.lineTo(x-b,y-a);c.lineTo(x-a,y-a);c.closePath();}
  else {c.arc(x,y,r*.55,0,7);for(let i=0;i<8;i++){const a=i*Math.PI/4;c.moveTo(x+Math.cos(a)*r*.75,y+Math.sin(a)*r*.75);c.lineTo(x+Math.cos(a+.2)*r*1.15,y+Math.sin(a+.2)*r*1.15);c.lineTo(x+Math.cos(a-.2)*r*1.15,y+Math.sin(a-.2)*r*1.15);c.closePath();}}
}
// 記号バッジ：駅の色で塗り、濃い縁どり（色が見分けにくくても形で読める）
function drawSym(c,k,x,y,r,o={}){if(k<0||k>=SYM.length)return;c.save();if(o.alpha!==undefined)c.globalAlpha*=o.alpha;
  symPath(c,k,x,y,r);c.lineJoin='round';c.lineWidth=o.lw??Math.max(1.6,r*.38);c.strokeStyle=o.stroke??'#0b0f22';c.stroke();c.fillStyle=o.fill??SCOL[k];c.fill();c.restore();}
const START_X=2;
const seatX=i=>35+i*70;
const SEAT_Y=404, FLOOR_Y=604;
const WIN_EM='🪑', MISS_EM='❄️';
const CLOAKS=['#7a3a3a','#2f5a7a','#5a4a7a','#3f6a4a','#7a5a2a','#4a4a5a'];
const HAIR=['#2a1a10','#5a3a1a','#1a1a2a','#8a5a2a','#d8d0c0'];

// ============ 旅人 ============
function makePassenger(gen){
  const r=gen(),f=gen();
  return {kind:r<0.72?'normal':'mado',fake:f<0.12?'samugari':f<0.24?'tomoshi':null,tst:Math.floor(gen()*7),
    cloak:CLOAKS[Math.floor(gen()*CLOAKS.length)],hair:HAIR[Math.floor(gen()*HAIR.length)],ph:gen()*6.28};
}
function newRival(x,ai){return {x,target:x,arr:-1,decided:false,coat:ai()<0.5?'#3a4058':'#4a3a40',walk:0};}
// 合図：降りる駅までの残り r で決まる。色＝降りる駅の色
function tells(p){
  const r=p.off-g.s,t=g.t,ds=p.off-1,dc=SCOL[ds]||'#ffcf80';
  const o={hood:p.fake==='samugari',glow:0,col:'#ffcf80',st:-1,raise:0,flick:false,gaze:p.kind==='mado'};
  if(p.fake==='tomoshi'){o.glow=.62;o.st=p.tst;o.col=SCOL[p.tst];}
  if(g.phase!=='run')return o;
  if(p.kind==='normal'){
    if(r===2&&t>RUN*0.35){o.glow=.45;o.col=dc;o.st=ds;o.flick=true;}
    if(r===1){o.glow=.7;o.col=dc;o.st=ds;if(t>RUN*0.2)o.hood=true;if(t>RUN-1.6){o.raise=Math.min(1,(t-(RUN-1.6))/0.4);o.glow=1;}}
  }else{ // 窓ながめ：つぎで降りるのに支度がおそい
    if(r===1){if(t>RUN*0.5){o.glow=.7;o.col=dc;o.st=ds;o.gaze=false;}if(t>RUN-2.2)o.hood=true;if(t>RUN-1.2){o.raise=Math.min(1,(t-(RUN-1.2))/0.3);o.glow=1;}}
  }
  return o;
}
const rivalSees=p=>tells(p).hood;     // ほかの立ち客はフードしか見ない
const nextCol=()=>SCOL[g.s], afterCol=()=>SCOL[g.s+1];
// ===== 席取りの共通エンジン =====
// ゲーム側で定義するもの: N, STOPS, START_X, makePassenger(gen), tells(p), rivalSees(p), newRival(x,ai),
//   onRunTick(), onArrive(), onWin(i), onSteal(i,mine), onFinish(ok), WIN_EM, MISS_EM
const RUN=6.0, DOOR=1.8, CLAIM_T=0.35, LAST=STOPS.length;
let g=null;
function newGame(seed,mode){
  const gen=mulberry(seed), ai=mulberry(seed*31+7);
  // 席ごとに「次に座る人」の列を前もって作る（プレイヤーの動きで日替わりの中身が変わらない）
  const q=[];
  for(let i=0;i<N;i++){q.push([]);for(let k=0;k<16;k++){const p=makePassenger(gen);p.gap=1+Math.floor(gen()*8);q[i].push(p);}}
  g={seed,mode,gen,ai,q,qi:new Array(N).fill(0),s:0,phase:'run',t:0,T:0,seats:[],rivals:[],
     player:{x:START_X,target:START_X,arr:0,sat:false,walk:0},history:[],result:null,leavers:[],claimed:false,vacated:[],steals:[]};
  for(let i=0;i<N;i++)g.seats[i]=board(i,0);
  g.rivals.push(newRival(0,ai));g.rivals.push(newRival(N-1,ai));
  if(!AUTOTEST)FX.reset();
}
function board(i,stop){const p=Object.assign({},g.q[i][g.qi[i]++%16]);p.off=stop+p.gap;p.born=g.T;return p;}
function step(dt){
  if(!g||g.result)return;
  g.t+=dt;g.T+=dt;
  const pl=g.player;
  if(!pl.sat){const d=pl.target-pl.x;if(Math.abs(d)>0.001){pl.x+=Math.sign(d)*Math.min(Math.abs(d),4*dt);pl.walk+=dt;if(Math.abs(pl.target-pl.x)<0.001){pl.x=pl.target;pl.arr=g.T;}}}
  for(const rv of g.rivals){const d=rv.target-rv.x;if(Math.abs(d)>0.001){rv.x+=Math.sign(d)*Math.min(Math.abs(d),2*dt);rv.walk=(rv.walk||0)+dt;if(Math.abs(rv.target-rv.x)<0.001){rv.x=rv.target;rv.arr=g.T;}}}
  if(g.phase==='run'){
    onRunTick();
    // ライバルは走行の後半、自分の読み方(rivalSees)で見つけた席へ寄る（3席以内、65%）
    if(g.t>RUN-2.6){for(const rv of g.rivals){if(rv.decided)continue;rv.decided=true;
      let best=-1,bd=9;for(let i=0;i<N;i++){const p=g.seats[i];if(!p||p.sitPlayer)continue;if(!rivalSees(p))continue;const dd=Math.abs(i-rv.x);if(dd<=3&&dd<bd){bd=dd;best=i;}}
      if(best>=0&&g.ai()<0.65){rv.target=best;rv.arr=Infinity;}}}
    if(g.t>=RUN){g.s++;g.phase='door';g.t=0;arrive();}
  }else if(g.phase==='door'){
    if(!g.claimed&&g.t>=CLAIM_T){g.claimed=true;claim();}
    if(g.t>=DOOR&&!g.result){
      for(let i=0;i<N;i++)if(!g.seats[i])g.seats[i]=board(i,g.s);
      g.leavers=[];g.phase='run';g.t=0;g.claimed=false;g.rang=false;for(const rv of g.rivals)rv.decided=false;
      while(g.rivals.length<2){const x=g.ai()<0.5?0:N-1;g.rivals.push(newRival(x,g.ai));}
    }
  }
}
function arrive(){
  if(g.s>=LAST){finish(false);return;}
  g.vacated=[];
  for(let i=0;i<N;i++){const p=g.seats[i];if(p&&!p.sitPlayer&&p.off===g.s){g.leavers.push({x:i,p});g.seats[i]=null;g.vacated.push(i);}}
  onArrive();
}
function claim(){
  const pl=g.player;
  for(const i of g.vacated){
    const cands=[];
    if(!pl.sat&&Math.abs(pl.x-i)<0.2&&pl.target===i)cands.push({who:'p',arr:pl.arr});
    g.rivals.forEach((rv,k)=>{if(Math.abs(rv.x-i)<0.2)cands.push({who:k,arr:rv.arr===Infinity?g.T:rv.arr});});
    if(!cands.length)g.rivals.forEach((rv,k)=>{if(Math.abs(rv.x-i)<=1.05&&!cands.length)cands.push({who:k,arr:0});});
    if(!cands.length)continue;
    cands.sort((a,b)=>a.arr-b.arr);const w=cands[0].who;
    if(w==='p'){pl.sat=true;g.seats[i]={sitPlayer:true,at:g.T};onWin(i);finish(true);return;}
    const rv=g.rivals.splice(w,1)[0];g.seats[i]=board(i,g.s);g.seats[i].fromRival=rv;g.seats[i].sitAt=g.T;
    onSteal(i,pl.target===i&&Math.abs(pl.x-i)<1.2);
  }
  g.history.push(MISS_EM);
}
function finish(ok){
  if(ok)g.history.push(WIN_EM);
  g.result={ok,stop:g.s};
  onFinish(ok);
}
function setTarget(i){if(g.player.target!==i){g.player.target=i;g.player.arr=Infinity;if(typeof onMove==="function")onMove(i);}}
// 自動テスト用：戦略関数 choose(g) が毎フレーム「狙う席」を返す
function simulateSeat(seed,choose){
  newGame(seed,'practice');let guard=0;
  while(!g.result&&guard++<20000){if(g.phase==='run'){const b=choose();if(b>=0&&b!==g.player.target)setTarget(b);}step(1/30);}
  return g.result;
}
function runAutotest(strategies){
  const out={};
  for(const [name,mk] of Object.entries(strategies)){let sat=0,sum=0;const dist={};
    for(let s=1;s<=300;s++){const choose=mk(mulberry(s*7919+99));const r=simulateSeat(s*7919,choose);const k=r.ok?r.stop:'x';dist[k]=(dist[k]||0)+1;if(r.ok){sat++;sum+=r.stop;}}
    out[name]={runs:300,satRate:+(sat/300).toFixed(2),avgStop:+(sum/Math.max(1,sat)).toFixed(2),dist};}
  return out;
}


// ================= 演出フック =================
let hum=null,clackNext=0;
function onRunTick(){
  if(AUTOTEST)return;
  for(let i=0;i<N;i++){const p=g.seats[i];if(!p||p.sitPlayer)continue;const o=tells(p);const lit=o.glow>=.7&&!p.fake;
    if(lit&&!p._lit){p.litAt=performance.now()/1000;SND.tone({f:NOTE(79+((p.off*3)%7)),dur:.5,vol:.1,type:'sine',wet:.5,pan:(i-2.5)/4});SND.noise({dur:.15,vol:.08,type:'bandpass',freq:900,q:1,pan:(i-2.5)/4});
      FX.burst(seatX(i)+(i%2?-16:16),SEAT_Y-40,10,{col:[o.col,'#fff'],speed:70,g:-30,life:.7,size:2.5,glow:10});}
    if(o.hood&&!p._hood&&!p.fake){p.hoodAt=performance.now()/1000;SND.noise({dur:.14,vol:.08,type:'bandpass',freq:1400,q:1.5,pan:(i-2.5)/4});}
    if(o.raise>0&&!p._raise){SND.bell({f:NOTE(91),vol:.035,dur:.8,pan:(i-2.5)/4});}
    p._lit=lit;p._hood=o.hood;p._raise=o.raise>0;}
}
function onArrive(){
  g.arriveAt=g.T;
  if(AUTOTEST)return;
  SND.tone({f:2400,slide:.7,dur:.7,vol:.025,type:'sine',wet:.2});
  SND.noise({dur:.8,vol:.08,type:'highpass',freq:3000,at:.5,wet:.2});
  SND.bell({f:NOTE(84),vol:.06,at:.7,dur:1.4});SND.bell({f:NOTE(79),vol:.06,at:.95,dur:1.6});
  FX.shake(3,.3);hum&&hum.set(.012,34,140);
  for(const L of g.leavers)FX.burst(seatX(L.x),SEAT_Y-40,10,{col:[SCOL[g.s-1],'#fff'],speed:90,g:-20,life:1,size:3,glow:10});

function drawTraveler(x,baseY,p,o,f,s=1){
  const T=performance.now()/1000+(p.ph||0);
  // 降りる人の合図（2026-10-26 polish3・見た目だけ）：揺れ・息づかい・身じろぎの強さは、いま見えている合図（フード／ランタンを掲げる）だけから決める。新しい情報は足さない
  const prep=o.hood?(p.hoodAt?Math.min(1,(performance.now()/1000-p.hoodAt)/0.6):1):0,rk0=o.raise||0;
  const breath=Math.sin(T*(1.8+prep*1.1))*(1+prep*.9);

  ctx.fillStyle='#f1d0ae';ctx.beginPath();ctx.arc(0,0,12,0,7);ctx.fill();
  ctx.fillStyle=p.hair;ctx.beginPath();ctx.arc(-f*2,-3,12,Math.PI*(f>0?0.8:-0.2),Math.PI*(f>0?2.2:1.2));ctx.fill();
  ctx.fillStyle='#2a1a14';ctx.beginPath();ctx.arc(f*6,(o.gaze?-3:0),1.8,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,120,120,.35)';ctx.beginPath();ctx.arc(f*5,5,3,0,7);ctx.fill();
  // フード
  const hk=o.hood?(p.hoodAt?easeOutBack(Math.min(1,(performance.now()/1000-p.hoodAt)/0.3)):1):0;
  if(hk>0){ctx.save();ctx.translate(0,(1-hk)*16);ctx.fillStyle=p.cloak;ctx.beginPath();ctx.moveTo(-f*16,12);ctx.quadraticCurveTo(-f*18,-14,-f*4,-17);ctx.quadraticCurveTo(f*10,-16,f*13,-2);ctx.quadraticCurveTo(f*9,-12,f*1,-12);ctx.quadraticCurveTo(-f*8,-8,-f*6,10);ctx.closePath();ctx.fill();
    ctx.beginPath();ctx.moveTo(-f*4,-17);ctx.quadraticCurveTo(-f*14,-24,-f*20,-16);ctx.lineTo(-f*14,-12);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-f*20,-16,3,0,7);ctx.fill();ctx.restore();}
  else{ctx.fillStyle=p.cloak;ctx.beginPath();ctx.ellipse(-f*4,13,13,5,0,0,7);ctx.fill();}
  ctx.restore();

  // 白い息（フードをかぶった人だけ、ときどき）
  if(prep>0.5){const cy=(T*.42)%1;if(cy<.5){const a=cy/.5;ctx.fillStyle=`rgba(236,242,255,${.3*(1-a)*prep})`;ctx.beginPath();ctx.arc(f*(15+a*12),hy+5-a*7,2+a*5,0,7);ctx.fill();}}
  const rk=rk0;const sway=Math.sin(T*2.6)*(.6+prep*1.4+rk*2.2);const lx=f*(16+rk*4)+sway,ly=lerp(-24,-82,easeOut(rk))+Math.abs(sway)*.25;
  ctx.strokeStyle=p.cloak;ctx.lineWidth=6;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(f*6,-44);ctx.quadraticCurveTo(f*16,lerp(-34,-60,rk),lx,ly-12);ctx.stroke();
  drawLantern(lx,ly,o);
  ctx.restore();
}

// 設定（歯車）：ことばの切替。保存は localStorage 'lantern_lang'（?lang= は確認用で保存しない）
$('bGear').onclick=()=>{$('start').style.display='none';$('settings').style.display='flex';};
$('bSetClose').onclick=()=>{$('settings').style.display='none';showStart();};
document.querySelectorAll('#settings [data-lang]').forEach(b=>b.onclick=()=>I18NKIT.set(b.dataset.lang));
I18NKIT.init('lantern',I18N);applyTitle();I18NKIT.onchange=applyTitle;

let lastT=performance.now(),clackT=0;
function frame(nowMs){const dt=Math.min(.05,(nowMs-lastT)/1000);lastT=nowMs;
  const run=FX.update(dt);
  if(run&&g&&!g.result)step(dt);
  const sp=speedNow();scroll+=dt*380*sp;stepSnow(dt);
  // レールの継ぎ目の音（タタン…タタン）
  if(g&&!g.result&&SND.on&&sp>0.2){clackT+=dt*sp;if(clackT>0.85){clackT=0;SND.noise({dur:.05,vol:.05*sp,type:'bandpass',freq:1600,q:2});SND.kick({f0:110,f1:50,dur:.12,vol:.12*sp});
    SND.noise({dur:.05,vol:.045*sp,type:'bandpass',freq:1400,q:2,at:.13});SND.kick({f0:100,f1:45,dur:.12,vol:.1*sp,at:.13});}}
  if(hum&&g&&g.phase==='run')hum.set(.018+.022*sp,34+10*sp,160+140*sp);
  draw();requestAnimationFrame(frame);}
window.dbg={get g(){return g},I18NKIT,stopName,tells,setTarget,shareText,nextCol,afterCol,seatX};

// ================= 自動テスト（?autotest=1） =================
// smart=行先板のしるしと灯り＋フード＋かかげを組み合わせて読む／colorOnly=「つぎ」の色の灯りだけ見る（灯りずきに釣られる）
// symbolOnly=色を使わず記号の形だけで読む／cvdColorOnly=色の一部を見分けにくい仮定で、色だけで読む（記号なしの状態に相当）
// hoodOnly=フードだけ（ほかの立ち客と同じ読み）／random=駅ごとにランダムな席／stay=動かない
const lit=(o)=>o.glow>0.05;
// 自動テスト用の単純化した仮定：赤・橙・緑（ヒバチ台/シモヨ町/ケムリ峠）、青・紫（ネムリの辻/ユキミ坂）、桃・白（サンゴ浜/ワタユキ原）を見分けにくいプレイヤー（実際の色覚特性の再現ではない）
const CVD=[1,0,0,2,1,0,2,3];
if(AUTOTEST){
  const strategies={
    smart:r=>()=>{let best=-1,bs=0.6;for(let i=0;i<N;i++){const p=g.seats[i];if(!p||p.sitPlayer)continue;const o=tells(p);const nx=lit(o)&&o.col===nextCol(),af=lit(o)&&o.col===afterCol()&&o.flick;
      const s=(o.raise>0?5:0)+(nx&&o.hood?3:0)+(nx&&!o.hood?0.7:0)+(af?0.8:0)-Math.abs(i-g.player.x)*0.1;if(s>bs){bs=s;best=i;}}return best;},
    colorOnly:r=>()=>{let best=-1,bs=0;for(let i=0;i<N;i++){const p=g.seats[i];if(!p||p.sitPlayer)continue;const o=tells(p);const s=(lit(o)&&o.col===nextCol()?2:0)-Math.abs(i-g.player.x)*0.1;if(s>bs){bs=s;best=i;}}return best;},
    symbolOnly:r=>()=>{let best=-1,bs=0;for(let i=0;i<N;i++){const p=g.seats[i];if(!p||p.sitPlayer)continue;const o=tells(p);const s=(lit(o)&&o.st>=0&&SYM[o.st]===SYM[g.s]?2:0)-Math.abs(i-g.player.x)*0.1;if(s>bs){bs=s;best=i;}}return best;},
    cvdColorOnly:r=>()=>{let best=-1,bs=0;for(let i=0;i<N;i++){const p=g.seats[i];if(!p||p.sitPlayer)continue;const o=tells(p);const s=(lit(o)&&o.st>=0&&CVD[o.st]===CVD[g.s]?2:0)-Math.abs(i-g.player.x)*0.1;if(s>bs){bs=s;best=i;}}return best;},
    hoodOnly:r=>()=>{let best=-1,bs=0;for(let i=0;i<N;i++){const p=g.seats[i];if(!p||p.sitPlayer)continue;const s=(tells(p).hood?2:0)-Math.abs(i-g.player.x)*0.1;if(s>bs){bs=s;best=i;}}return best;},
    random:r=>{let last=-1,b=-1;return ()=>{if(g.s!==last){last=g.s;b=Math.floor(r()*N);}return b;};},
    stay:r=>()=>-1};
  const out=runAutotest(strategies);
  const sig=s=>{newGame(s,'daily');return JSON.stringify(g.q.map(c=>c.slice(0,4).map(p=>p.kind+p.gap+(p.fake||''))));};
  const ts=+(PARAMS.get('seed')||todaySeed());out.daily={seed:ts,same:sig(ts)===sig(ts),differsFromNextDay:sig(ts)!==sig(ts+1)};
  const pre=document.createElement('pre');pre.id='autotest';pre.textContent=JSON.stringify(out,null,1);document.body.appendChild(pre);document.title='AUTOTEST done';
}else{showStart();requestAnimationFrame(frame);}
</script>
</body>
