<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>試作12</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" hidden><span id="qno">1/10</span><span id="score">○ 0</span></div>
<div id="timer" hidden><div id="bar"></div><span id="sec">10</span></div>
<button id="mute" type="button" aria-label="音を消す" title="音を消す"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z" fill="currentColor"/><path id="mwave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/><path id="mx" d="M16 9l6 6M22 9l-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" style="display:none"/></svg></button>
<div id="bubble" hidden></div>
<div id="qpanel">
<div id="rx" hidden>
  <div class="rxhead"><span>処方箋</span><span id="rxno"></span></div>
  <div class="rxrow"><b>病名</b><span id="rxdis"></span></div>
  <div class="rxrow"><b>メモ</b><span id="rxmemo"></span></div>
  <div id="rxres"></div>
</div>
<div id="choices" hidden></div>
</div>
<div id="start" class="panel">
  <p>処方箋を持った人が並んでいます。<br>処方箋が出たら <b>10秒</b> 以内に、<br>3つの薬から正しいものを選ぶ。<br>全部で10人。</p>
  <button id="go" class="big">はじめる</button>
</div>
<div id="end" class="panel" hidden>
  <p id="endscore"></p>
  <p id="endtext"></p>
  <button id="again" class="big">もう一度遊ぶ</button>
</div>
<div id="note">ゲーム用の創作です。実際の医療判断には使わないでください</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
