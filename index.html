<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>試作</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f6f4ef;color:#222;-webkit-text-size-adjust:100%}
ul{list-style:none;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 6px calc(16px + env(safe-area-inset-bottom));max-width:1200px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card{display:block;background:#fff;border-radius:8px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 4px rgba(0,0,0,.12);-webkit-tap-highlight-color:transparent;height:100%}
.card:active{transform:scale(.98)}
.card img{display:block;width:100%;height:auto;aspect-ratio:16/9;object-fit:cover;background:#ddd}
.d{display:block;font-size:10px;color:#444;padding:5px 5px 7px;line-height:1.4}
</style>
</head>
<body>
<ul>
  <li><a class="card" href="shisaku1/"><img src="shisaku1/thumb.jpg" alt="" width="640" height="360" loading="lazy"><span class="d">人にふれて仲間を増やし、群れで街を埋めつくそう</span></a></li>
  <li><a class="card" href="shisaku2/"><img src="shisaku2/thumb.jpg" alt="" width="640" height="360" loading="lazy"><span class="d">同じものをくっつけて、大きく進化させよう</span></a></li>
  <li><a class="card" href="shisaku3/"><img src="shisaku3/thumb.jpg" alt="" width="640" height="360" loading="lazy"><span class="d">ゆれるゆりかごに落として、同じ子どうしを合体</span></a></li>
  <li><a class="card" href="shisaku4/"><img src="shisaku4/thumb.jpg" alt="" width="640" height="360" loading="lazy"><span class="d">夜行列車で、次に降りる人の前に立って早く座ろう</span></a></li>
  <li><a class="card" href="shisaku5/"><img src="shisaku5/thumb.jpg" alt="" width="640" height="360" loading="lazy"><span class="d">重さのちがう物を、同じしゅんかんに着地させよう</span></a></li>
  <li><a class="card" href="shisaku6/"><img src="shisaku6/thumb.jpg" alt="" width="640" height="360" loading="lazy"><span class="d">見えない風を読んで、種を森の友だちのうろへ</span></a></li>
  <li><a class="card" href="shisaku7/"><img src="shisaku7/thumb.jpg" alt="" width="640" height="360" loading="lazy"><span class="d">しずくの拍でタップ。ずれた にせのしずくは がまん</span></a></li>
  <li><a class="card" href="shisaku8/"><img src="shisaku8/thumb.jpg" alt="" width="640" height="360" loading="lazy"><span class="d">指をはなさず、1→2→3… と毛糸をかけよう</span></a></li>
  <li><a class="card" href="shisaku9/"><img src="shisaku9/thumb.jpg" alt="" width="640" height="360" loading="lazy"><span class="d">じゃらしで猫をさそって、水しぶきの庭をかけぬけよう</span></a></li>
  <li><a class="card" href="shisaku10/"><img src="shisaku10/thumb.jpg" alt="" width="640" height="360" loading="lazy"><span class="d">糸巻きを回して、凧でひかりの玉をつなごう</span></a></li>
  <li><a class="card" href="shisaku11/"><img src="shisaku11/thumb.jpg" alt="" width="640" height="360" loading="lazy"><span class="d">本をドミノみたいに倒して、ぱたぱたつなげよう</span></a></li>
</ul>
</body>
</html>
