<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Noto Sans JP",sans-serif;background:#f6f4ef;color:#222;-webkit-text-size-adjust:100%}
header{padding:calc(16px + env(safe-area-inset-top)) 16px 8px;max-width:960px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}
header p{margin:0;color:#666;font-size:14px}
ul{list-style:none;margin:0 auto;padding:calc(10px + env(safe-area-inset-top)) 6px calc(16px + env(safe-area-inset-bottom));max-width:1200px;display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.card{display:block;background:#fff;border-radius:8px;overflow:hidden;text-decoration:none;color:inherit;box-shadow:0 1px 4px rgba(0,0,0,.12);-webkit-tap-highlight-color:transparent}
.card:active{transform:scale(.98)}
.card img{display:block;width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;background:#ddd}
.t{display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;font-size:15px;font-weight:700;color:#fff}
li:nth-child(5n+1) .t{background:#e07a5f}li:nth-child(5n+2) .t{background:#3d85a8}li:nth-child(5n+3) .t{background:#6a994e}li:nth-child(5n+4) .t{background:#9b72aa}li:nth-child(5n) .t{background:#d4a017}
.d{display:block;font-size:14px;color:#555;padding:0 14px 14px;line-height:1.5}
</style>
</head>
